<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ReLoop: a simple second-hand marketplace demo." />
    <title>My listings | ReLoop</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="mystyles.css" />
    <script src="myapp.js" defer></script>
  </head>
  <body data-page="mylistings">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- The shared navigation is created by initLayout() in myapp.js. -->
    <header id="site-header" class="site-header"></header>
    <noscript>
      <p class="notice">Enable JavaScript to browse, sell, and save purchases.</p>
    </noscript>
    <main id="main" class="container">
      <section class="intro">
        <h1>My listings</h1>
        <p>Edit your items or update their availability.</p>
        <a class="button" href="sell.html">Sell an item</a>
      </section>
      <p class="stats">
        Active:
        <strong id="stat-active">0</strong>
        · Sold:
        <strong id="stat-sold">0</strong>
        · Enquiries:
        <strong id="stat-enquiries">0</strong>
      </p>
      <!-- renderMyListings() adds your items and local reports to these containers. -->
      <div id="my-listings" class="product-grid"></div>
      <p id="my-empty" class="empty-state" hidden>
        No listings yet.
        <a href="sell.html">Add your first item.</a>
      </p>
      <section class="panel">
        <h2>Saved reports</h2>
        <div id="reports-list"></div>
      </section>
    </main>
    <!-- The shared footer is also created by initLayout(). -->
    <footer id="site-footer" class="site-footer"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
