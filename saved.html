<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ReLoop: a simple second-hand marketplace demo." />
    <title>Saved items | ReLoop</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="mystyles.css" />
    <script src="myapp.js" defer></script>
  </head>
  <body data-page="saved">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- The shared navigation is created by initLayout() in myapp.js. -->
    <header id="site-header" class="site-header"></header>
    <noscript>
      <p class="notice">Enable JavaScript to browse, sell, and save purchases.</p>
    </noscript>
    <main id="main" class="container">
      <section class="intro">
        <h1>Saved items</h1>
        <p>Your favourites, kept for later.</p>
      </section>
      <!-- renderSaved() shows products whose IDs are stored in your favourites. -->
      <div id="saved-grid" class="product-grid"></div>
      <p id="saved-empty" class="empty-state" hidden>
        No saved items.
        <a href="list.html">Browse products.</a>
      </p>
    </main>
    <!-- The shared footer is also created by initLayout(). -->
    <footer id="site-footer" class="site-footer"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
